<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartGuard Owner Dashboard</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #0b1020;
            color: white;
            padding: 30px;
        }


        .container {
            max-width: 1200px;
            margin: auto;
        }


        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }


        h1 {
            font-size: 32px;
        }


        .status {
            padding: 10px 18px;
            border-radius: 20px;
            background: #123b25;
            color: #4cff91;
            font-weight: bold;
        }


        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }


        .card {
            background: #151c32;
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #293452;
        }


        .card h3 {
            color: #aab4d4;
            margin-bottom: 15px;
        }


        .value {
            font-size: 36px;
            font-weight: bold;
        }


        #riskLevel {
            color: #4cff91;
        }


        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }


        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }


        .refresh {
            background: #2672ff;
            color: white;
        }


        .reset {
            background: #f0a500;
            color: black;
        }


        .delete {
            background: #e63946;
            color: white;
        }


        .section {
            background: #151c32;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }


        .section h2 {
            margin-bottom: 20px;
        }


        #currentEvents {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }


        .event {
            background: #252e49;
            padding: 10px 15px;
            border-radius: 8px;
        }


        table {
            width: 100%;
            border-collapse: collapse;
        }


        th,
        td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #293452;
        }


        th {
            color: #aab4d4;
        }


        .normal {
            color: #4cff91;
            font-weight: bold;
        }


        .suspicious {
            color: #ffd166;
            font-weight: bold;
        }


        .high {
            color: #ff4d6d;
            font-weight: bold;
        }


        .alert {
            display: none;
            background: #4a1520;
            border: 1px solid #ff4d6d;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            color: #ff8fa3;
            font-weight: bold;
        }


        @media (max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

            body {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <header>

        <div>

            <h1>🛡️ SmartGuard</h1>

            <p>Owner Security Dashboard</p>

        </div>


        <div class="status">

            ● SYSTEM ONLINE

        </div>

    </header>



    <div id="alertBox" class="alert">

        🚨 SECURITY ALERT DETECTED

    </div>



    <div class="cards">


        <div class="card">

            <h3>Risk Score</h3>

            <div class="value" id="riskScore">

                0

            </div>

        </div>



        <div class="card">

            <h3>Risk Level</h3>

            <div class="value" id="riskLevel">

                NORMAL

            </div>

        </div>



        <div class="card">

            <h3>Incidents Recorded</h3>

            <div class="value" id="incidentCount">

                0

            </div>

        </div>


    </div>



    <div class="controls">

        <button class="refresh" onclick="loadIncidents()">

            🔄 Refresh Dashboard

        </button>


        <button class="reset" onclick="resetSystem()">

            🔄 Reset Security State

        </button>


        <button class="delete" onclick="deleteHistory()">

            🗑️ Delete History

        </button>

    </div>



    <div class="section">

        <h2>🔐 Current Security Events</h2>

        <div id="currentEvents">

            <div class="event">

                No active security events

            </div>

        </div>

    </div>



    <div class="section">

        <h2>📜 Incident History</h2>


        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Event</th>

                    <th>Risk Score</th>

                    <th>Risk Level</th>

                    <th>Timestamp</th>

                </tr>

            </thead>


            <tbody id="incidentTable">

            </tbody>

        </table>

    </div>


</div>



<script>


async function loadIncidents() {

    try {

        // Add timestamp to prevent browser caching
        const response = await fetch(
            "/incidents?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

        const data = await response.json();


        const incidents = data.incidents;


        document.getElementById("incidentCount").innerText =
            incidents.length;


        const table =
            document.getElementById("incidentTable");


        table.innerHTML = "";


        if (incidents.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="5">
                        No incidents recorded
                    </td>
                </tr>
            `;

            updateRisk(0, "NORMAL");

            updateCurrentEvents([]);

            return;

        }


        incidents.forEach(incident => {

            let className = "normal";


            if (incident.risk_level === "SUSPICIOUS") {

                className = "suspicious";

            }


            if (incident.risk_level === "HIGH RISK") {

                className = "high";

            }


            const row = document.createElement("tr");


            row.innerHTML = `

                <td>${incident.id}</td>

                <td>${formatEvent(incident.event)}</td>

                <td>${incident.risk_score}</td>

                <td class="${className}">
                    ${incident.risk_level}
                </td>

                <td>${incident.timestamp}</td>

            `;


            table.appendChild(row);

        });


        // Latest incident controls the dashboard status

        const latest = incidents[0];


        updateRisk(
            latest.risk_score,
            latest.risk_level
        );


        // Display active events from latest records

        updateCurrentEvents(incidents);


    }

    catch (error) {

        console.error(error);

    }

}



function updateRisk(score, level) {

    document.getElementById("riskScore").innerText =
        score;


    const riskElement =
        document.getElementById("riskLevel");


    riskElement.innerText =
        level;


    const alertBox =
        document.getElementById("alertBox");


    if (
        level === "SUSPICIOUS" ||
        level === "HIGH RISK"
    ) {

        alertBox.style.display = "block";

        alertBox.innerText =
            "🚨 SECURITY ALERT: " +
            level +
            " detected!";

    }

    else {

        alertBox.style.display = "none";

    }

}



function updateCurrentEvents(incidents) {

    const container =
        document.getElementById("currentEvents");


    container.innerHTML = "";


    const events = [];


    incidents.forEach(incident => {

        if (!events.includes(incident.event)) {

            events.push(incident.event);

        }

    });


    if (events.length === 0) {

        container.innerHTML = `
            <div class="event">
                No active security events
            </div>
        `;

        return;

    }


    events.slice(0, 10).forEach(event => {

        const div =
            document.createElement("div");


        div.className = "event";


        div.innerText =
            "⚠️ " + formatEvent(event);


        container.appendChild(div);

    });

}



function formatEvent(event) {

    const names = {

        "unknown_rfid": "Unknown RFID",

        "high_vibration": "High Vibration",

        "door_forced": "Door Forced",

        "unusual_access_time": "Unusual Access Time",

        "sensor_disconnection":
            "Sensor Disconnection",

        "authorized_rfid":
            "Authorized RFID"

    };


    return names[event] || event;

}



async function resetSystem() {

    try {

        const response = await fetch("/reset", {
            method: "POST",
            cache: "no-store"
        });

        const data = await response.json();

        console.log("Reset response:", data);

        // Immediately clear dashboard
        updateRisk(0, "NORMAL");

        document.getElementById("incidentCount").innerText = "0";

        document.getElementById("currentEvents").innerHTML = `
            <div class="event">
                No active security events
            </div>
        `;

        document.getElementById("incidentTable").innerHTML = `
            <tr>
                <td colspan="5">
                    No active incidents
                </td>
            </tr>
        `;

        alert("Security state reset successfully!");

    }

    catch (error) {

        console.error("Reset error:", error);

        alert("Unable to reset system");

    }

}


async function deleteHistory() {

    const confirmation =
        confirm(
            "Are you sure you want to permanently delete ALL incident history?"
        );


    if (!confirmation) {

        return;

    }


    try {

        const response =
            await fetch(
                "/delete-history",
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        alert(data.message);


        loadIncidents();

    }

    catch (error) {

        alert("Unable to delete history");

        console.error(error);

    }

}



// Initial dashboard load
loadIncidents();


// Automatically refresh dashboard every 1 second
setInterval(loadIncidents, 1000);


</script>


</body>

</html>
